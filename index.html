<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e0c1a;color:#f1ecf8;font:16px system-ui,sans-serif;text-align:center}a{color:#f0bd5c}</style>

<body>
<p>Abriendo Expansión 23… <a href="app/">Entrar</a></p>
<script>
// Quita el service worker de la ruta anterior y entra a la app.
(async () => {
  try { const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.filter(r => new URL(r.scope).pathname === "/expansion/").map(r => r.unregister())); } catch (e) {}
  location.replace("app/");
})();
</script>
</body>
