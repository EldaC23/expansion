<html lang="es">

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400&family=Outfit:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Diseño: una columna estrecha pensada para el celular. Barra inferior con 4 secciones; la sesión de audio abre una pantalla completa. */
:root {
  --bg: #0e0c1a;
  --surface: #17142a;
  --surface-2: #211d3a;
  --line: #2e2950;
  --fg: #f1ecf8;
  --muted: #a29bc0;
  --ver: #f0bd5c;
  --sentir: #e58fb0;
  --actuar: #7fd1b9;
  --on-accent: #0e0c1a;
  --accent: var(--ver);
  --f-display: "Newsreader", Georgia, serif;
  --f-body: "Outfit", system-ui, sans-serif;
  --f-mono: "DM Mono", ui-monospace, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f2fb; --surface: #ffffff; --surface-2: #ece6f6; --line: #d9d0ea;
    --fg: #221a3a; --muted: #5f5780; --ver: #8a5a00; --sentir: #a23a68; --actuar: #0b6f5a;
    --on-accent: #ffffff; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f6f2fb; --surface: #ffffff; --surface-2: #ece6f6; --line: #d9d0ea;
  --fg: #221a3a; --muted: #5f5780; --ver: #8a5a00; --sentir: #a23a68; --actuar: #0b6f5a;
  --on-accent: #ffffff; color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 400 16px/1.55 var(--f-body);
  padding-block: 24px 110px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
.app { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; }
[data-phase="ver"] { --accent: var(--ver); }
[data-phase="sentir"] { --accent: var(--sentir); }
[data-phase="actuar"] { --accent: var(--actuar); }

.kicker { font: 500 12px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(38px, 10vw, 52px); line-height: 1.02; }
h2 { font-size: 30px; line-height: 1.1; }
h3 { font-size: 22px; line-height: 1.2; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 12px; }
.hero { display: grid; gap: 10px; }
.hero em { color: var(--accent); }
.dots { display: flex; gap: 6px; }
.dots i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.dots i.ok { background: var(--accent); }
.dots i.now { background: var(--muted); }

.btn { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 999px; padding: 13px 22px; font-weight: 600; font-size: 16px; justify-self: start; }
.btn:hover { filter: brightness(1.08); }
.btn.full { justify-self: stretch; text-align: center; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); font-weight: 500; }
.btn.warn { background: var(--sentir); color: var(--on-accent); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 9px 15px; font-size: 15px; text-align: left; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 20%, transparent); border-color: var(--accent); }
.chip.block { border-radius: 14px; width: 100%; }
.field { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; width: 100%; min-width: 0; }
.field:focus-visible { border-color: var(--accent); }
.lbl { font: 500 12px/1.3 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

.task { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
.task:first-of-type { border-top: 0; }
.num { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 500 14px var(--f-mono); border: 1px solid var(--line); color: var(--muted); }
.task.done .num { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.task h4 { margin: 0; font: 500 16px/1.3 var(--f-body); }
.task p { font-size: 14px; color: var(--muted); }
.mini { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 14px; white-space: nowrap; }
.mini.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }

.layers { display: grid; gap: 10px; }
.layer { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: start; }
.layer b { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 500 11px var(--f-mono); letter-spacing: .06em; color: var(--on-accent); }
.layer:nth-child(1) b { background: var(--ver); } .layer:nth-child(2) b { background: var(--sentir); } .layer:nth-child(3) b { background: var(--actuar); }
.layer h4 { margin: 0; font: 600 16px var(--f-body); }

.phase { display: grid; gap: 8px; }
.phase h3 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.phase h3 span { font: 500 11px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
details.day { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; }
details.day summary { list-style: none; cursor: pointer; padding: 13px 0; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
details.day summary::-webkit-details-marker { display: none; }
details.day .body { padding: 0 0 14px 40px; display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
.day.locked { opacity: .55; }
.badge { font: 500 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.badge.ok { color: var(--accent); }

.back { background: transparent; border: 0; padding: 4px 0; color: var(--muted); justify-self: start; font-size: 15px; }
.phrase { font: italic 400 26px/1.25 var(--f-display); color: var(--accent); }
.old { font: 400 18px/1.3 var(--f-display); color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.tip { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 14.5px; display: grid; gap: 6px; }
canvas.collage { width: 100%; height: auto; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); display: block; }
.plan-item { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 8px; }
.plan-item .top { display: flex; gap: 10px; justify-content: space-between; align-items: start; }
.x { background: transparent; border: 0; color: var(--muted); font-size: 20px; line-height: 1; padding: 0 4px; }
.note { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 14.5px; }

nav.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5; }
nav.bar div { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
nav.bar button { background: transparent; border: 0; padding: 10px 4px 9px; display: grid; gap: 3px; justify-items: center; font-size: 12px; color: var(--muted); }
nav.bar button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
nav.bar button[aria-current="page"] { color: var(--fg); }
nav.bar button[aria-current="page"] svg { stroke: var(--ver); }

#sess { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: none; overflow-y: auto;
  padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#sess.open { display: block; }
.sess { max-width: 480px; margin: 0 auto; display: grid; gap: 16px; text-align: center; }
.orb-wrap { display: grid; place-items: center; height: 300px; position: relative; }
.ring { position: absolute; width: 270px; height: 270px; border-radius: 50%; border: 1px dashed var(--line); }
.orb { width: 220px; height: 220px; border-radius: 50%; transform: scale(.7); will-change: transform;
  background: radial-gradient(circle at 38% 32%, color-mix(in srgb, var(--accent) 60%, #fff) 0%, var(--accent) 40%, color-mix(in srgb, var(--accent) 30%, var(--bg)) 100%);
  box-shadow: 0 0 80px color-mix(in srgb, var(--accent) 40%, transparent); }
.orb-label { position: absolute; font: 500 14px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--on-accent); }
.clock { font: 500 20px var(--f-mono); font-variant-numeric: tabular-nums; color: var(--muted); }
.sess .row { justify-content: center; }
input[type=range] { width: 100%; accent-color: var(--accent); }

.pbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: var(--surface-2); border: 1px solid var(--sentir); border-radius: 16px; padding: 12px 14px; display: grid; gap: 8px; margin-bottom: 4px; }
.pbar .kicker { color: var(--sentir); }
.pbar .chip { padding: 6px 11px; font-size: 14px; }
.ico { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; color: var(--on-accent); background: var(--accent); }
.ico svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.dayhero { border-radius: 22px; padding: 22px 20px; display: grid; gap: 12px; border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line));
  background: linear-gradient(150deg, color-mix(in srgb, var(--accent) 24%, var(--surface)) 0%, var(--surface) 70%); }
.dh-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.dh-top h1 { font-size: 56px; line-height: 1; }
.headline { font: 400 28px/1.15 var(--f-display); text-wrap: balance; }
.linkbtn { background: transparent; border: 0; padding: 0; color: var(--accent); font-size: 14px; text-decoration: underline; justify-self: start; }
.ringsvg { width: 74px; height: 74px; flex: none; }
.ringsvg circle { fill: none; stroke-width: 7; }
.ringsvg .bg { stroke: var(--line); }
.ringsvg .fg { stroke: var(--accent); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dasharray .6s ease; }
.ringsvg text { fill: var(--fg); font: 500 15px var(--f-mono); text-anchor: middle; dominant-baseline: central; }
.tl { position: relative; display: grid; gap: 12px; }
.tl::before { content: ""; position: absolute; left: 21px; top: 30px; bottom: 30px; width: 2px; background: var(--line); }
.tcard { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; padding: 14px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
.tcard .ico { background: var(--surface-2); color: var(--muted); }
.tcard.now { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.tcard.now .ico, .tcard.done .ico { background: var(--accent); color: var(--on-accent); }
.tc-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.tc-top h4 { margin: 0; font: 600 16px var(--f-body); }
.tc-min { font: 500 12px var(--f-mono); color: var(--muted); white-space: nowrap; }
.tc-body { display: grid; gap: 6px; min-width: 0; }
.tc-body p { font-size: 14.5px; color: var(--muted); }
.tc-state { font: 500 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.commit { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 18px; border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.commit p { font: 400 20px/1.25 var(--f-display); }
.celebrate { border-radius: 22px; padding: 20px; display: grid; gap: 6px; text-align: center; border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.celebrate .big { font: 400 32px/1.1 var(--f-display); }
.whybanner { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; padding: 16px; border-radius: 18px; background: linear-gradient(150deg, color-mix(in srgb, var(--accent) 20%, var(--surface)), var(--surface) 80%); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); }
.whybanner b { font: 500 12px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.cue { font: italic 400 24px/1.35 var(--f-display); min-height: 100px; display: grid; align-items: center; padding: 0 4px; text-wrap: balance; }
.cue.in { animation: cueIn .9s ease; }
@keyframes cueIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
#welcome { position: fixed; inset: 0; z-index: 12; background: var(--bg); display: none; overflow-y: auto;
  padding-block: calc(28px + env(safe-area-inset-top, 0px)) calc(28px + env(safe-area-inset-bottom, 0px));
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
#welcome.open { display: block; }
.wel { max-width: 480px; margin: 0 auto; min-height: calc(100vh - 80px); display: grid; align-content: space-between; gap: 22px; }
.wel-body { display: grid; gap: 18px; align-content: start; animation: cueIn .6s ease; }
.wel h1 { font-size: clamp(36px, 10vw, 46px); }
.wrow { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 14px; align-items: center; }
.wrow .ico { width: 48px; height: 48px; border-radius: 50%; }
.wrow h4 { margin: 0; font: 600 17px var(--f-body); }
.wrow p { font-size: 14.5px; color: var(--muted); }
.wdots { display: flex; gap: 8px; justify-content: center; }
.wdots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.wdots i.on { background: var(--ver); width: 24px; border-radius: 4px; }
.wnav { display: grid; gap: 10px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; animation: none !important; } }
</style>
</head>
<body>
<main class="app" id="view" aria-live="polite"></main>

<nav class="bar" aria-label="Secciones"><div id="nav"></div></nav>

<section id="sess" aria-label="Sesión de audio">
  <div class="sess" data-phase="ver" id="sessBox">
    <div><div class="kicker" id="sPhase"></div><h2 id="sTitle"></h2><p class="muted small" id="sDesc"></p></div>
    <div class="orb-wrap"><div class="ring"></div><div class="orb" id="orb"></div><div class="orb-label" id="orbLabel">Listo</div></div>
    <p class="cue" id="cue"></p>
    <div class="clock" id="clock">15:00</div>
    <div class="row" id="sDur" role="group" aria-label="Duración"></div>
    <button class="btn full" id="sGo" type="button">Comenzar</button>
    <div class="row"><label class="lbl" for="vol" style="min-width:76px">Volumen</label><input id="vol" type="range" min="0" max="100" value="80" style="flex:1"></div>
    <p class="muted small" id="sTip">Con audífonos se percibe mejor el pulso. Busca un lugar tranquilo y mantén la pantalla encendida.</p>
    <button class="back" id="sClose" type="button" style="justify-self:center">Cerrar</button>
  </div>
</section>

<section id="welcome" aria-label="Bienvenida"><div class="wel" id="welBox"></div></section>

<script>
/* ============ Utilidades ============ */
const $ = (s) => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const esc = (x) => String(x == null ? "" : x).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const dayKey = (d = new Date()) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const parseKey = (k) => { const a = k.split("-").map(Number); return new Date(a[0], a[1] - 1, a[2]); };
const daysBetween = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 864e5);
const fmt = (s) => { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };

/* ============ Contenido ============ */
const PHASES = [
  { id: "ver", name: "Ver", tag: "Fase 3", days: [0, 1, 2], line: "Tu nueva realidad se vuelve visible.", track: { id: "apertura", name: "Apertura", band: "Alfa 10 Hz", carrier: 200, beat: 10, drones: [132, 198, 264], noise: { type: "pink", cutoff: 900, gain: 0.05, lfo: 0.07 }, breath: [5, 5] } },
  { id: "sentir", name: "Sentir", tag: "Fase 6", days: [3, 4, 5], line: "Tu cuerpo aprende a sostenerla.", track: { id: "merecimiento", name: "Merecimiento", band: "Theta-alfa 7,5 Hz", carrier: 180, beat: 7.5, drones: [144, 216, 288], noise: { type: "brown", cutoff: 500, gain: 0.07, lfo: 0.06 }, breath: [5, 7] } },
  { id: "actuar", name: "Actuar", tag: "Fase 9", days: [6, 7, 8], line: "Tu plan se vuelve coherente con tu meta.", track: { id: "enfoque", name: "Enfoque dorado", band: "Beta baja 14 Hz", carrier: 220, beat: 14, drones: [110, 165], noise: { type: "pink", cutoff: 1400, gain: 0.04, lfo: 0.05 }, breath: [4, 6] } }
];
const DAYS = [
  { t: "Tu punto de partida", intro: "Define hacia dónde vas y en quién necesitas convertirte.", kind: "goal", ch: "Cuéntale a una persona de confianza cuál es tu objetivo." },
  { t: "El viejo software", intro: "Identifica la resistencia que más te repites y elige la frase que la reemplaza.", kind: "block", ch: "Haz hoy algo que llevas días posponiendo y te da pereza." },
  { t: "Tu mapa de realidad", intro: "Arma una imagen de la vida que vas a crear y mírala con gratitud.", kind: "reality", ch: "Pide algo que normalmente no pedirías: un favor, un descuento o una opinión." },
  { t: "Desmontar la creencia", intro: "Comprueba si tu pensamiento limitante es un hecho o solo una suposición.", kind: "socratic", ch: "Di “no” con calma a algo que no quieres hacer." },
  { t: "Neutralizar el miedo", intro: "Mira de frente el peor escenario y baja el tamaño de tu miedo.", kind: "decat", ch: "Habla con alguien nuevo sobre lo que quieres crear." },
  { t: "Cuerpo en calma", intro: "Relaja el cuerpo para poder sostener lo que estás creando.", kind: "body", ch: "Muestra algo tuyo sin esperar a que esté perfecto." },
  { t: "Tu nueva versión", intro: "Decide desde la versión de ti que ya logró sus metas.", kind: "reframe", ch: "Haz la llamada o manda el mensaje que has estado evitando." },
  { t: "Tu plan de acción", intro: "Revisa el tamaño de tu plan y elige tres acciones concretas con fecha.", kind: "plan", ch: "Haz hoy la primera acción de tu plan." },
  { t: "El primer paso real", intro: "Cierra el ciclo con acción y decide tu próximo paso.", kind: "close", ch: "Da el siguiente paso de tu plan y decide el que sigue." }
];
const DAYX = [
  { h: "Hoy defines quién vas a ser", why: "Todo cambio empieza cuando decides hacia dónde vas y en quién te conviertes. Hoy lo dejas claro.", how: ["Respira con el círculo y piensa en tu objetivo como si ya fuera real.", "Elige tu pilar, tu objetivo y tres cualidades que quieres encarnar.", "Cuéntale a una persona de confianza cuál es tu objetivo."], mins: [10, 3, 5] },

  const s = Math.min(im.width, im.height), c = document.createElement("canvas"); c.width = c.height = 640;
  c.getContext("2d").drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, 640, 640);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
  try { await dbDo("readwrite", s2 => s2.put(blob, "foto")); } catch (e) {} fotoImg = await blobToImage(blob); render();
}
async function delFoto() { try { await dbDo("readwrite", s => s.delete("foto")); } catch (e) {} fotoImg = null; render(); }

function summaryDay(i) {
  const d = S.data || {}, out = [], p = pilar(), b = BLOCKS.find(x => x.id === d.bloqueo);
  if (!S.days[i] || !S.days[i].step) return "";

  if (i === 1 && b) out.push("Lo que me repetía: " + b.old, "Lo nuevo: " + d.fraseNueva, "Intensidad: " + d.intensidad + " de 5");
  if (i === 2) out.push("Escenas: " + (d.escenas || []).map(s => SCENE_NAMES[s]).join(", "));
  if (i === 3) out.push("Pensamiento: " + d.pensamiento, "Evidencia: " + ({ suposicion: "es solo una suposición", parcial: "algo de evidencia", cierto: "me parece cierto" })[d.evidencia], "En neutro: " + d.neutra, "Lo creía " + d.creeAntes + " de 5, ahora " + d.creeDespues + " de 5");

    else h += '<p class="small muted">Es tu propio pensamiento, así que escríbelo con tus palabras. Una pista para empezar:</p><div class="row">' + STARTERS.map(t => '<button class="chip" type="button" data-act="starter" data-v="' + esc(t) + '">' + esc(t) + "</button>").join("") + '</div><input class="field" data-in="neutra" maxlength="100" placeholder="Tu frase en neutro (máx. 100)" value="' + esc(d.neutra || "") + '">';
    h += '<div class="lbl">4. Suelta el pensamiento</div>' + practica("Soltar el pensamiento · 90 s", 90, ["Respira lento tres veces.", "Di en silencio: «Estoy teniendo el pensamiento de que " + (d.pensamiento || "…") + "»", "Míralo pasar como una nube, sin discutir con él.", "Repite tu frase neutra tres veces: " + (d.neutra || "…")], "soltar", d) +
      '<div class="lbl">¿Cuánto te crees este pensamiento ahora? (1 poco, 5 totalmente)</div>' + scale5("creeDespues", d);
    if (d.creeAntes && d.creeDespues) h += '<div class="tip">' + (+d.creeDespues < +d.creeAntes ? "Pasaste de creerlo " + d.creeAntes + " a " + d.creeDespues + " sobre 5. Mirarlo como una suposición le quitó fuerza." : +d.creeDespues === +d.creeAntes ? "Lo crees igual que antes. Repite la práctica mañana: soltar un pensamiento toma práctica." : "Hoy lo sientes más fuerte. Es normal; respira y vuelve a la frase neutra.") + "</div>";
  } else if (dy.kind === "decat") {
    h += '<div class="lbl">¿Qué tan grande se siente tu miedo ahora? (1 pequeño, 5 enorme)</div>' + scale5("miedoAntes", d) +
      '<div class="lbl">¿Qué acción te da miedo hoy?</div>' + oneLine("accionMiedo", ACC_MIEDO, d, "O escríbela (máx. 100)") +
      '<div class="lbl">1. ¿Qué es lo peor que podría pasar si tomas acción hoy?</div>' + oneLine("peor", PEOR, d, "O escríbelo (máx. 100)") +
      '<div class="lbl">2. Ponle tamaño real: ¿qué tan probable es que pase?</div><div class="row">' + chips("prob", PROB, d.prob) + '</div><div class="lbl">¿Cuántas veces ha pasado de verdad?</div><div class="row">' + chips("veces", VECES, d.veces) + "</div>";
    if (d.prob && d.veces) h += '<div class="tip">Tu mente lo siente como un ' + (d.miedoAntes || "?") + " de 5, pero la probabilidad real es " + lab(PROB, d.prob).toLowerCase() + " y " + lab(VECES, d.veces).toLowerCase() + ". El miedo suele agrandar lo que no se mira.</div>";
    h += '<div class="lbl">3. Si eso ocurriera, ¿cuál sería tu plan práctico para solucionarlo?</div>' + oneLine("planPractico", PLANB, d, "O escríbelo (máx. 100)") +
      '<div class="lbl">4. Recuerda una situación difícil que sí superaste</div>' + oneLine("superado", SUPERADO, d, "O escríbela (máx. 100)");
    if (d.superado) h += '<div class="tip">Ya superaste eso. Tienes recursos para esto también.</div>';
    h += '<div class="lbl">5. ¿Y qué es lo mejor que podría pasar si todo sale bien?</div>' + oneLine("mejor", MEJOR, d, "O escríbelo (máx. 100)") +
      '<div class="lbl">Y lo más probable (opcional)</div>' + oneLine("probable", PROBABLE, d, "O escríbelo (máx. 100)") +
      '<div class="lbl">6. Tu frase de valentía</div>' + oneLine("valentia", VALENTIA, d, "O escríbela (máx. 100)") +
      '<div class="lbl">7. Ensayo mental</div><div class="tip"><p>1. Cierra los ojos y respira lento tres veces.</p><p>2. Imagínate dando el paso que te da miedo.</p><p>3. Mira lo peor que podría pasar y a ti resolviéndolo con calma, con tu plan.</p><p>4. Mira ahora lo mejor y siente la satisfacción.</p><p>5. Repite tu frase de valentía.</p>' + timerBtn(90) + '</div><div class="row">' + chips("ensayo", [["si", "Hice mi ensayo mental"]], d.ensayo) + "</div>" +
      '<div class="lbl">8. La versión más pequeña de esa acción que puedes hacer hoy</div>' + oneLine("miniAccion", MINI, d, "O escríbela (máx. 100)") + '<p class="small muted">Esta será tu acción real de hoy.</p>' +
      '<div class="lbl">Ahora, ¿qué tan grande se siente tu miedo? (1 pequeño, 5 enorme)</div>' + scale5("miedoDespues", d);
    if (d.miedoAntes && d.miedoDespues) h += '<div class="tip">' + (+d.miedoDespues < +d.miedoAntes ? "Tu miedo bajó de " + d.miedoAntes + " a " + d.miedoDespues + ". Mirarlo de frente le quitó tamaño." : +d.miedoDespues === +d.miedoAntes ? "Tu miedo se mantiene igual. Repite el ejercicio mañana o apóyate en tu plan práctico." : "Hoy el miedo subió un poco. Es normal; respira y sigue con tu plan.") + "</div>";
  } else if (dy.kind === "body") {
    h += '<div class="tip"><p>Recorre el cuerpo despacio, 20 segundos en cada zona, soltando la tensión al exhalar:</p>' + BODYSCAN.map(z => "<p>• " + z + "</p>").join("") + timerBtn(180) + "</div>" +
      practica("Respiración de calma · 2 min", 120, ["Pon una mano en el abdomen y otra en el pecho.", "Inhala por la nariz contando hasta 4.", "Exhala despacio por la boca contando hasta 6.", "Repite durante dos minutos, soltando los hombros."], "calma", d) +
      '<div class="lbl">Algo que dejo de hacer a partir de hoy</div><div class="row">' + chips("compromiso", COMMIT, d.compromiso) + "</div>";
    if (d.compromiso) h += '<div class="lbl">Cuando me den ganas de ' + esc(String(d.compromiso).toLowerCase()) + ", en su lugar voy a…</div>" + oneLine("reemplazo", REEMPLAZOS, d, "O escríbelo (máx. 100)");
  } else if (dy.kind === "reframe") {
    h += '<div class="lbl">1. ¿Qué reto o decisión tienes pendiente hoy?</div>' + oneLine("reto", RETOS, d, "O escríbelo (máx. 100)") +
      '<div class="lbl">2. Frente a este reto, ¿qué decisión tomaría hoy la versión de ti que ya logró todas sus metas?</div>' + oneLine("decision", DECIS, d, "O escríbelo (máx. 100)") +
      '<div class="lbl">3. Ensaya esa decisión</div>' + practica("Ensayo de decisión · 90 s", 90, ["Cierra los ojos y respira lento tres veces.", "Imagina a la versión de ti que ya logró todas sus metas frente a este reto: " + (d.reto || "tu reto") + ".", "Mírala: cómo se para, cómo habla y qué decide.", "Ahora toma tú esa decisión desde ese lugar.", "Siente la calma de haber decidido."], "ensayoDecision", d) +
      '<div class="lbl">4. Tu primer gesto de hoy: la acción más pequeña para ejecutar esa decisión en 10 minutos</div>' + oneLine("primerGesto", PRIMER, d, "O escríbelo (máx. 100)") + '<p class="small muted">Esta será tu acción real de hoy.</p>';
  } else if (dy.kind === "plan") {
    const plan = d.plan || [];
    h += '<div class="lbl">¿Tu plan actual es del tamaño de tu meta?</div><div class="row">' + chips("tamano", [["pequeno", "Muy pequeño para mi meta"], ["justo", "Del tamaño justo"], ["sin", "No tengo plan"]], d.tamano) + "</div>" + (d.tamano ? '<div class="tip">' + tamanoTip(d.tamano) + "</div>" : "");
    h += p ? '<div class="lbl">Elige 3 acciones concretas (' + plan.length + " de 3)</div><div class=\"row\">" + p.acts.map(a => '<button class="chip block" type="button" data-act="addplan" data-v="' + esc(a) + '" aria-pressed="' + plan.some(x => x.t === a) + '">' + esc(a) + "</button>").join("") + '</div><div class="row"><input class="field" id="own" maxlength="60" placeholder="O añade una propia (máx. 60)" style="flex:1"><button class="btn ghost" type="button" data-act="addown">Añadir</button></div>' : '<p class="muted">Primero completa el día 1.</p>';
    h += plan.map((x, k) => '<div class="plan-item"><div class="top"><b style="font-weight:500">' + esc(x.t) + '</b><button class="x" type="button" data-act="delplan" data-v="' + k + '" aria-label="Quitar">×</button></div><div class="lbl">¿Cuándo lo hago?</div><div class="row">' + CUANDO.map(([v, n]) => '<button class="chip" type="button" data-act="when" data-k="' + k + '" data-v="' + v + '" aria-pressed="' + (x.cuando === v) + '">' + n + "</button>").join("") + '</div><div class="lbl">¿Cuándo me lo recuerdo?</div><div class="row">' + PISTAS.map(v => '<button class="chip" type="button" data-act="pitem" data-k="' + k + '" data-f="pista" data-v="' + esc(v) + '" aria-pressed="' + (x.pista === v) + '">' + esc(v) + "</button>").join("") + '</div><div class="lbl">Obstáculo más probable</div><div class="row">' + OBST.map(v => '<button class="chip" type="button" data-act="pitem" data-k="' + k + '" data-f="obst" data-v="' + esc(v) + '" aria-pressed="' + (x.obst === v) + '">' + esc(v) + "</button>").join("") + "</div>" + (x.pista && x.obst ? '<div class="tip">' + esc(planSent(x)) + "</div>" : "") + "</div>").join("");
    if (plan.length === 3) h += '<div class="lbl">Ensaya tu plan</div>' + practica("Verme haciéndolo · 60 s", 60, ["Cierra los ojos y respira lento tres veces.", "Imagínate haciendo tu primera acción justo cuando llega su pista.", "Mira que el obstáculo aparece y tú aplicas tu solución con calma.", "Siente la satisfacción de haberlo hecho."], "ensayoPlan", d);
  } else if (dy.kind === "close") {
    const plan = d.plan || [];
    h += '<div class="lbl">¿Qué acciones de tu plan ya hiciste?</div><div class="row">' + chips("hecho", plan.map(x => x.t), d.hecho || [], 3) + '</div><div class="lbl">Mi próximo paso en las próximas 24 horas</div><div class="row">' + chips("proximo", plan.map(x => x.t), d.proximo) + "</div>" +
      '<div class="lbl">Cierra tu ciclo</div>' + practica("Cierre de ciclo · 2 min", 120, ["Cierra los ojos y respira lento tres veces.", "Agradece tres cosas que lograste en estos 9 días.", "Mira tu collage o recuerda tu frase nueva.", "Di en voz baja: «Me comprometo a " + (d.proximo || "mi próximo paso") + "»."], "cierre", d) +
      '<div class="lbl">¿Qué aprendiste?</div>' + oneLine("aprendi", APREN, d, "O escríbelo (máx. 100)");
  }
  const ok = stepValid();
  h += '</section><button class="btn full" type="button" data-act="savestep"' + (ok ? "" : " disabled") + ">" + (i === todayIdx() ? "Guardar y terminar el paso" : "Guardar cambios") + "</button>";
  return h;
}
function stepValid() {
  const k = DAYS[stepIdx].kind, d = draft;
  if (k === "goal") return !!(d.nombre && d.nombre.trim() && d.pilar && (d.objetivo || (d.objetivoCustom || "").trim()) && (d.rasgos || []).length === 3);
  if (k === "block") return !!(d.bloqueo && d.intensidad && d.fraseNueva && BLOCKS.find(x => x.id === d.bloqueo).nw.includes(d.fraseNueva));
  if (k === "reality") return (d.escenas || []).length === 3;
  if (k === "socratic") return !!((d.pensamiento || "").trim() && d.creeAntes && d.evidencia && (d.neutra || "").trim() && !STARTERS.includes((d.neutra || "").trim()) && d.soltar === "si" && d.creeDespues);
  if (k === "decat") return !!(d.miedoAntes && (d.accionMiedo || "").trim() && (d.peor || "").trim() && d.prob && d.veces && (d.planPractico || "").trim() && (d.superado || "").trim() && (d.mejor || "").trim() && (d.valentia || "").trim() && d.ensayo === "si" && (d.miniAccion || "").trim() && d.miedoDespues);
  if (k === "body") return !!(d.compromiso && (d.reemplazo || "").trim() && d.calma === "si");
  if (k === "reframe") return !!((d.reto || "").trim() && (d.decision || "").trim() && d.ensayoDecision === "si" && (d.primerGesto || "").trim());
  if (k === "plan") return !!d.tamano && (d.plan || []).length === 3 && d.plan.every(x => x.cuando && x.pista && x.obst) && d.ensayoPlan === "si";
  if (k === "close") return !!(d.proximo && d.cierre === "si" && (d.aprendi || "").trim());
  return true;
}
let tmr = null;
function timerBtn(sec) { return '<div class="row" style="margin-top:8px"><button class="btn ghost" type="button" data-act="timer" data-v="' + sec + '">Iniciar temporizador (' + fmt(sec) + ')</button></div>'; }

/* ============ Bienvenida ============ */
let wel = { open: false, n: 0 };
const welSeen = () => store.get("e23_welcome", false);
function openWelcome() { wel = { open: true, n: 0 }; $("#welcome").classList.add("open"); renderWelcome(); }
function closeWelcome() { wel.open = false; $("#welcome").classList.remove("open"); store.set("e23_welcome", true); render(); }
function renderWelcome() {
  const n = wel.n, W = $("#welBox");
  const screens = [
    '<div class="wel-body"><div class="kicker">Bienvenida</div><h1>Hoy empieza <em style="color:var(--ver)">tu cambio</em></h1><p class="muted">Expansión 23 son 9 días para alinear tres cosas. Cada día toma unos 20 minutos y siempre sabrás qué hacer.</p>' +
    [["energia", "Energía", "Audios y respiración que calman tu cuerpo.", "ver"], ["mente", "Mente", "Cambias la frase vieja que te frena por una nueva.", "sentir"], ["accion", "Acción", "Un plan concreto y un paso real cada día.", "actuar"]].map(r => '<div class="wrow" data-phase="' + r[3] + '"><div class="ico">' + svg(r[0]) + "</div><div><h4>" + r[1] + "</h4><p>" + r[2] + "</p></div></div>").join("") + "</div>",
    '<div class="wel-body"><div class="kicker">Día 1</div><h1>Tu día 1 en <em style="color:var(--ver)">tres pasos</em></h1>' +
    [["audio", "Sesión de audio", "10 min", "Respira con el círculo y piensa en tu objetivo como si ya fuera real. El texto te guía."], ["paso", "Tu punto de partida", "3 min", "Eliges tu pilar, tu objetivo y tres cualidades de la persona que quieres ser."], ["accion", "Una acción real", "5 min", "Le cuentas tu objetivo a alguien de confianza. Decirlo en voz alta lo vuelve real."]].map(r => '<div class="tcard now" data-phase="ver" style="margin:0"><div class="ico">' + svg(r[0]) + '</div><div class="tc-body"><div class="tc-top"><h4>' + r[1] + '</h4><span class="tc-min">' + r[2] + "</span></div><p>" + r[3] + "</p></div></div>").join("") + "</div>",
    '<div class="wel-body"><div class="kicker">Antes de empezar</div><h1>Prepara tu <em style="color:var(--ver)">espacio</em></h1>' +
    [["Audífonos puestos", "Con ellos se percibe mejor el pulso del audio."], ["Un lugar tranquilo", "Sin notificaciones ni interrupciones."], ["Unos 20 minutos para ti", "Este tiempo es parte de tu cambio."]].map(r => '<div class="wrow" data-phase="ver"><div class="ico">' + svg("check") + "</div><div><h4>" + r[0] + "</h4><p>" + r[1] + "</p></div></div>").join("") + "</div>"
  ];
  W.innerHTML = screens[n] + '<div class="wnav"><div class="wdots">' + [0, 1, 2].map(k => '<i class="' + (k === n ? "on" : "") + '"></i>').join("") + '</div><button class="btn full" type="button" data-w="next" data-phase="ver">' + (n === 2 ? "Empezar mi día 1" : "Siguiente") + "</button>" + (n > 0 ? '<button class="back" type="button" data-w="prev" style="justify-self:center">Atrás</button>' : '<button class="back" type="button" data-w="skip" style="justify-self:center">Saltar</button>') + "</div>";
}
$("#welBox").addEventListener("click", (e) => { const b = e.target.closest("[data-w]"); if (!b) return; const w = b.dataset.w;
  if (w === "next") { if (wel.n === 2) closeWelcome(); else { wel.n++; renderWelcome(); } } else if (w === "prev") { wel.n--; renderWelcome(); } else if (w === "skip") closeWelcome(); });
function maybeWelcome() { if (!PREVIEW && !wel.open && !sess.open && view === "inicio" && S && !S.done && todayIdx() === 0 && !welSeen()) openWelcome(); }

/* ============ Eventos ============ */
$("#view").addEventListener("input", (e) => { const k = e.target.dataset.in; if (k) { draft[k] = e.target.value; const b = $('[data-act="savestep"]'); if (b) b.disabled = !stepValid(); } });
$("#view").addEventListener("change", (e) => {
  if (e.target.dataset && e.target.dataset.in === "pensamiento") { const ob = BLOCKS.find(b => b.neu.includes(draft.neutra)); if (ob && ob.old !== draft.pensamiento) draft.neutra = ""; renderKeep(window.scrollY); return; } if (e.target.id === "fotoIn" && e.target.files[0]) { const f = e.target.files[0]; e.target.value = ""; setFoto(f); } });
$("#view").addEventListener("click", (e) => {
  const a = e.target.closest("[data-act]"); if (!a) return; const act = a.dataset.act, v = a.dataset.v;
  if (act === "pon") { REAL = S; PREVIEW = true; store.set("e23_preview", true); S = makePreview(0); save(); view = "inicio"; render(); }
  else if (act === "pexit") { PREVIEW = false; store.set("e23_preview", false); try { localStorage.removeItem("e23_pstate"); } catch (e2) {} S = store.get("e23_state", null); REAL = null; view = "inicio"; render(); }
  else if (act === "pday") { S = v === "fin" ? makePreview(8, true) : makePreview(+v); save(); view = "inicio"; render(); }
  else if (act === "welcome") openWelcome();
  else if (act === "begin") { S = newState(); save(); render(); }
  else if (act === "again") { S = { ...newState(S), cycles: (S.cycles || 0) + 1 }; save(); render(); }
  else if (act === "session") openSession();
  else if (act === "step") openStep(todayIdx());
  else if (act === "commit") { const d = S.days[todayIdx()] = S.days[todayIdx()] || {}; d.commit = !d.commit; save(); render(); }
  else if (act === "challenge") { const d = S.days[todayIdx()] = S.days[todayIdx()] || {}; d.challenge = !d.challenge; save(); render(); }
  else if (act === "back") { view = "inicio"; render(); }
  else if (act === "pick") {
    const k = a.dataset.k, max = +a.dataset.max, path = k.split("."); let o = draft; if (path.length === 2) { o[path[0]] = o[path[0]] || {}; o = o[path[0]]; } const key = path[path.length - 1];
    if (max > 1) { const arr = o[key] || []; o[key] = arr.includes(v) ? arr.filter(x => x !== v) : arr.length < max ? arr.concat(v) : arr; }
    else { const prev = o[key]; o[key] = o[key] === v && FLAGS.includes(k) ? "" : v; if (k === "pensamiento") { const pb = BLOCKS.find(b => b.old === prev); if (pb && pb.neu.includes(draft.neutra)) draft.neutra = ""; } if (k === "pilar") { draft.objetivo = ""; draft.escenas = []; draft.plan = []; } if (k === "bloqueo") draft.fraseNueva = ""; }
    const y = window.scrollY; renderKeep(y);
  }
  else if (act === "addplan") { const plan = draft.plan || []; draft.plan = plan.some(x => x.t === v) ? plan.filter(x => x.t !== v) : plan.length < 3 ? plan.concat({ t: v, cuando: "manana" }) : plan; renderKeep(window.scrollY); }
  else if (act === "addown") { const t = ($("#own").value || "").trim(); const plan = draft.plan || []; if (t && plan.length < 3) { draft.plan = plan.concat({ t, cuando: "manana" }); renderKeep(window.scrollY); } }
  else if (act === "delplan") { draft.plan = draft.plan.filter((x, k) => k !== +v); renderKeep(window.scrollY); }
  else if (act === "pitem") { draft.plan[+a.dataset.k][a.dataset.f] = v; renderKeep(window.scrollY); }
  else if (act === "when") { draft.plan[+a.dataset.k].cuando = v; renderKeep(window.scrollY); }
  else if (act === "timer") startTimer(a, +v);
  else if (act === "starter") { draft.neutra = v + " "; const f = document.querySelector('[data-in="neutra"]'); if (f) { f.value = draft.neutra; f.focus(); } const sb = document.querySelector('[data-act="savestep"]'); if (sb) sb.disabled = !stepValid(); }
  else if (act === "savestep") {
    if (!stepValid()) return;
    const prev = S.data || {}; S.data = JSON.parse(JSON.stringify(draft));
    if (DAYS[stepIdx].kind === "goal" && prev.pilar && prev.pilar !== draft.pilar) { S.data.escenas = []; S.data.plan = []; }
    const d = S.days[stepIdx] = S.days[stepIdx] || {}; d.step = true;
    if (stepIdx === 8 && dayDone(8)) S.done = true;
    save(); view = "inicio"; render();
  }
  else if (act === "download") { const c = $("#cv"); c.toBlob((b) => { const u = URL.createObjectURL(b), l = document.createElement("a"); l.href = u; l.download = "mi-realidad.png"; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); }); }
  else if (act === "delfoto") delFoto();
  else if (act === "theme") { store.set("e23_theme", v); applyTheme(); render(); }
  else if (act === "ask-reset") { askMode = "reset"; render(); }
  else if (act === "ask-wipe") { askMode = "wipe"; render(); }
  else if (act === "cancel") { askMode = ""; render(); }
  else if (act === "reset") { S = { ...newState(S), restarts: (S.restarts || 0) }; askMode = ""; save(); view = "inicio"; render(); }
  else if (act === "wipe") { try { localStorage.removeItem("e23_state"); } catch (e2) {} dbDo("readwrite", s => s.delete("foto")).catch(() => {}); S = null; fotoImg = null; askMode = ""; view = "inicio"; render(); }
});
function renderKeep(y) { render(); window.scrollTo(0, y); }
function startTimer(btn, sec) {
  if (tmr) { clearInterval(tmr); tmr = null; }
  const end = Date.now() + sec * 1000; btn.disabled = false;
  const upd = () => { const left = Math.max(0, Math.round((end - Date.now()) / 1000)); const b = $('[data-act="timer"]'); if (b) b.textContent = left ? "Quedan " + fmt(left) + " (tocar para reiniciar)" : "Listo. Respira y agradece."; if (!left) { clearInterval(tmr); tmr = null; } };
  upd(); tmr = setInterval(upd, 500);
}
$("#nav").addEventListener("click", (e) => { const b = e.target.closest("[data-nav]"); if (b) { view = b.dataset.nav; askMode = ""; render(); } });
function applyTheme() { const t = store.get("e23_theme", "auto"); if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t); }
if (PREVIEW) { REAL = S; S = store.get("e23_pstate", null) || makePreview(0); }
applyTheme();
loadFoto().then(() => render());
render();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
